name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Validate HTML references and structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.refs = []
                  self.anchors = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("src", "href", "srcset"):
                      value = attrs.get(key, "")
                      if not value:
                          continue
                      candidates = [part.strip().split()[0] for part in value.split(",")] if key == "srcset" else [value]
                      for candidate in candidates:
                          if candidate.startswith("#"):
                              self.anchors.append(candidate[1:])
                          elif not re.match(r"^(https?:|mailto:|tel:|data:|javascript:)", candidate, re.I):
                              self.refs.append(candidate.split("#", 1)[0].split("?", 1)[0])

          audit = Audit()
          audit.feed(html)
          duplicates = sorted({item for item in audit.ids if audit.ids.count(item) > 1})
          missing = sorted({ref for ref in audit.refs if ref and not (root / ref).is_file()})
          missing_anchors = sorted(set(audit.anchors) - set(audit.ids))
          if duplicates or missing or missing_anchors:
              print({"duplicate_ids": duplicates, "missing_files": missing, "missing_anchors": missing_anchors})
              sys.exit(1)
          if not html.lstrip().lower().startswith("<!doctype html>"):
              raise SystemExit("Missing HTML5 doctype")
          if "Kazibwe Ivan" not in html:
              raise SystemExit("Expected site identity not found")
          if "fonts.googleapis.com" in html or "fonts.gstatic.com" in html:
              raise SystemExit("External Google Fonts request remains")
          if "clarity.ms/tag/" in html:
              raise SystemExit("Third-party Clarity bootstrap remains")
          if 'rel="preload" as="image" href="images/ivan-10-720.webp"' not in html:
              raise SystemExit("Optimized hero image preload is missing")
          if "images/ivan-04-640.webp" not in html or "images/ivan-10-480.webp" not in html:
              raise SystemExit("Responsive WebP image variants are not referenced")
          print("HTML structure, IDs, anchors, local assets, responsive images and preload passed.")
          PY

      - name: Check CSS syntax balance and obsolete handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path("style.css").read_text(encoding="utf-8")
          js = Path("script.js").read_text(encoding="utf-8")
          depth = 0
          for char in css:
              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
              if depth < 0:
                  raise SystemExit("CSS has an unexpected closing brace")
          if depth:
              raise SystemExit("CSS braces are unbalanced")
          if "gallery-item" in js or "lightbox" in js:
              raise SystemExit("Obsolete gallery/lightbox JavaScript remains")
          if "body.light-theme .site-nav" not in css:
              raise SystemExit("Light-theme mobile navigation contrast rule is missing")
          if "fonts.googleapis.com" in css or "fonts.gstatic.com" in css:
              raise SystemExit("External font dependency remains in CSS")
          if "IntersectionObserver" not in js:
              raise SystemExit("IntersectionObserver navigation optimization is missing")
          print("CSS brace balance, system-font setup and scroll optimization passed.")
          PY
