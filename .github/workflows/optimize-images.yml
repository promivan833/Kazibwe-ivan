name: Optimize portfolio images

on:
  push:
    branches: [main]
    paths:
      - "images/ivan-04.jpg"
      - "images/ivan-10.jpg"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create responsive WebP images
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          variants = [
              ("images/ivan-04.jpg", "images/ivan-04-640.webp", 640),
              ("images/ivan-10.jpg", "images/ivan-10-480.webp", 480),
              ("images/ivan-10.jpg", "images/ivan-10-720.webp", 720),
          ]

          for source, destination, max_width in variants:
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                  image.save(destination, "WEBP", quality=80, method=6)
                  print(f"{source} -> {destination}: {image.width}x{image.height}, {Path(destination).stat().st_size} bytes")
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Add responsive WebP portfolio images"
            git push
          fi
